# Category weights per horizon (they need not sum to 100; the engine normalizes). Factors within a category share its
# weight equally unless overridden under `factors`. Scores are a heuristic composite — NOT a backtested edge.

categories:
  valuation:        {long: 25, medium: 12, short: 2}
  quality:          {long: 20, medium: 8,  short: 0}
  growth:           {long: 15, medium: 15, short: 3}
  balance_sheet:    {long: 12, medium: 8,  short: 2}
  capital_allocation: {long: 8, medium: 4, short: 0}
  macro:            {long: 10, medium: 12, short: 5}
  trend:            {long: 5,  medium: 20, short: 18}
  patterns:         {long: 0,  medium: 4,  short: 18}    # candlesticks, chart patterns, swing setup, alignment (2-20 day horizon)
  volatility:       {long: 2,  medium: 5,  short: 8}
  options:          {long: 0,  medium: 6,  short: 14}
  flow:             {long: 0,  medium: 4,  short: 14}
  sentiment:        {long: 1,  medium: 4,  short: 7}
  events:           {long: 1,  medium: 6,  short: 9}
  shorts:           {long: 1,  medium: 4,  short: 5}
  analysts:         {long: 3,  medium: 10, short: 3}    # incl. PEAD, estimate revisions/trend, consensus shift (research: strongest 1-6 month signals)

# Optional per-factor multipliers (default 1.0)
factors:
  valuation.dcf_upside: 1.5
  valuation.reverse_dcf_gap: 1.2
  trend.ma_stack: 1.3
  options.iv_rank: 1.2
  events.days_to_earnings: 1.0
  analysts.pead: 1.3
  analysts.estimate_revisions: 1.3
  analysts.estimate_trend: 1.2
  quality.gross_profitability: 1.2
  quality.asset_growth: 1.1
  patterns.short_term_reversal: 1.1

# Label bands for the 0-100 score
bands:
  - [0, 20, "Strongly negative"]
  - [20, 40, "Negative"]
  - [40, 60, "Neutral"]
  - [60, 80, "Positive"]
  - [80, 101, "Strongly positive"]

min_coverage_for_verdict: 0.5
